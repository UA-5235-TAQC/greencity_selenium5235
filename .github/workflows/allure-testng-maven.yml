name: PR Tests with Allure Report

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            google-chrome-stable \
            fonts-liberation \
            libnss3 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Confirm Chrome
        run: |
          google-chrome-stable --version

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Run tests
        run: mvn clean test
        continue-on-error: true
        env:
          BASE_UI_GREEN_CITY_URL: ${{ secrets.BASE_UI_GREEN_CITY_URL }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          USER_ID: ${{ secrets.USER_ID }}
          IMPLICITLY_WAIT: ${{ secrets.IMPLICITLY_WAIT }}
          USER_LOCATION: ${{ secrets.USER_LOCATION }}
          USER_RATE: ${{ secrets.USER_RATE }}
          HEADLESS_MODE: ${{ secrets.HEADLESS_MODE }}


      # ⬇️ Забираємо history з gh-pages
      - name: Load Allure history
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- history || true
          mkdir -p target/allure-results
          cp -r history target/allure-results/ || true

      - name: Generate Allure Report
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -xzf allure.tgz
          ./allure-2.25.0/bin/allure generate target/allure-results -o allure-report --clean

      # ⬇️ зберігаємо history назад
      - name: Save Allure history
        run: |
          mkdir -p allure-report/history
          cp -r allure-report/history history

      - name: Deploy report to gh-pages (PR folder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: pr-${{ github.event.pull_request.number }}

      - name: Comment PR with Allure link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}/`;
            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 **Allure Report**: ${url}`
            });
